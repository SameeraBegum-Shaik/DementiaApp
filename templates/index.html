<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🧠 Dementia MRI Predictor</title>
<style>
body {
  background: linear-gradient(135deg,#89f7fe,#66a6ff);
  height:100vh; display:flex; justify-content:center; align-items:center;
  font-family:'Poppins',sans-serif;
}
.card {
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
  padding:30px; border-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
  text-align:center; color:#fff; width:400px;
}
input[type=file] { margin-top:15px; color:#333; }
button {
  margin-top:15px; padding:10px 25px;
  background:#007bff; color:#fff; border:none;
  border-radius:10px; cursor:pointer;
  transition:0.3s;
}
button:hover { background:#0056b3; }
img {
  margin-top:20px; width:250px;
  border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.3);
}
</style>
</head>
<body>
<div class="card">
  <h2>🧠 Dementia MRI Stage Predictor</h2>
  <form action="/predict" method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept="image/*" required><br>
    <button type="submit">Predict</button>
  </form>

  {% if prediction %}
  <h3>Prediction: {{ prediction }}</h3>
  <h4>Confidence: {{ confidence }}%</h4>
  <img src="{{ image_path }}" alt="Uploaded MRI">
  {% endif %}
</div>
</body>
</html>
